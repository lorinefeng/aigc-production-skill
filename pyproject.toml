[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aigc-production"
version = "0.1.0"
description = "Production-oriented AIGC image workflow and Codex skill"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "karpsie" }]
dependencies = [
  "httpx>=0.27,<1",
  "pillow>=10,<13",
  "python-dotenv>=1,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pyyaml>=6,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
aigc-production = "aigc_production.cli:app"

[project.urls]
Homepage = "https://github.com/lorinefeng/aigc-production-skill"
Repository = "https://github.com/lorinefeng/aigc-production-skill"
Issues = "https://github.com/lorinefeng/aigc-production-skill/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aigc_production"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
